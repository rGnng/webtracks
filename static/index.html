<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e0f">
<meta name="color-scheme" content="dark">
<title>WebTracks</title>
<link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">

  <header id="toolbar" class="toolbar">
    <div class="toolbar-leading">
      <nav id="section-tabs" class="section-tabs" aria-label="Library sections"></nav>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <div class="transport">
        <button id="prev-button" class="tb-button transport-button" type="button" title="Previous" aria-label="Previous">
          <svg class="icon"><use href="#i-previous"></use></svg>
        </button>
        <button id="play-button" class="tb-button transport-button prominent" type="button" title="Play" aria-label="Play">
          <svg class="icon" id="play-icon"><use href="#i-play"></use></svg>
        </button>
        <button id="next-button" class="tb-button transport-button" type="button" title="Next" aria-label="Next">
          <svg class="icon"><use href="#i-next"></use></svg>
        </button>
      </div>
      <button id="quality-button" class="tb-button" type="button" title="Audio quality" aria-label="Audio quality">
        <svg class="icon"><use href="#i-waveform"></use></svg>
      </button>
    </div>

    <div id="lcd-cluster" class="lcd-cluster">
      <div id="lcd" class="lcd idle">
        <div id="lcd-idle" class="lcd-idle">
          <svg class="icon lcd-disc"><use href="#i-optical-disc"></use></svg>
        </div>
        <div id="lcd-playing" class="lcd-playing hidden">
          <div id="lcd-art-wrap" class="lcd-art-wrap">
            <img id="lcd-art" class="lcd-art" alt="" draggable="false">
            <div id="lcd-art-fallback" class="lcd-art-fallback">
              <svg class="icon"><use href="#i-music"></use></svg>
            </div>
          </div>
          <div class="lcd-main">
            <button id="lcd-shuffle" class="lcd-side-btn" type="button" title="Shuffle" aria-label="Shuffle">
              <svg class="icon"><use href="#i-shuffle"></use></svg>
            </button>
            <div class="lcd-center">
              <button id="lcd-title-button" class="lcd-title-button" type="button" title="Show album">
                <span id="lcd-title" class="lcd-title"></span>
                <span id="lcd-subtitle" class="lcd-subtitle"></span>
              </button>
            </div>
            <div class="lcd-side-group">
              <button id="lcd-star" class="lcd-side-btn" type="button" title="Star" aria-label="Star">
                <svg class="icon"><use href="#i-star"></use></svg>
              </button>
              <button id="lcd-repeat" class="lcd-side-btn" type="button" title="Repeat" aria-label="Repeat">
                <svg class="icon"><use href="#i-repeat"></use></svg>
              </button>
            </div>
            <div class="lcd-times">
              <span id="lcd-elapsed" class="tabular">0:00</span>
              <button id="lcd-duration" class="lcd-time-button tabular" type="button" title="Show remaining time">0:00</button>
            </div>
            <div id="lcd-seek" class="seek-hit" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="seek-track"></div>
              <div id="lcd-seek-fill" class="seek-fill"></div>
            </div>
          </div>
        </div>
      </div>
      <button id="queue-button" class="tb-button queue-button" type="button" title="Queue" aria-label="Queue">
        <svg class="icon"><use href="#i-list"></use></svg>
      </button>
    </div>

    <div class="toolbar-trailing">
      <label class="search-field" id="search-field">
        <svg class="icon search-icon"><use href="#i-search"></use></svg>
        <input id="search-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search">
        <button id="search-clear" class="search-clear hidden" type="button" title="Clear search" aria-label="Clear search">
          <svg class="icon tiny"><use href="#i-x-circle"></use></svg>
        </button>
      </label>
    </div>
  </header>

  <div id="workspace" class="workspace">
    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <footer id="statusbar" class="statusbar">
    <div class="status-left">
      <button id="setup-button" class="status-gear" type="button" title="Setup" aria-label="Setup">
        <svg class="icon"><use href="#i-gear"></use></svg>
      </button>
      <div id="status-system" class="status-system" title="System status">Ready</div>
    </div>
    <div id="status-text" class="status-text"></div>
    <div class="status-right">
      <div id="status-online" class="status-online" title="Online users">
        <svg class="icon"><use href="#i-globe"></use></svg>
        <span id="status-online-count" class="tabular">0</span>
      </div>
      <div id="status-cache" class="status-cache" title="Server Cache"></div>
      <div id="status-playing" class="status-playing hidden" title="Playing">
        <svg class="icon tiny"><use href="#i-play"></use></svg>
      </div>
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata"></audio>

<div id="queue-popover" class="queue-popover hidden" role="dialog" aria-label="Queue">
  <div class="queue-tabs" role="tablist">
    <button class="queue-tab active" data-queue-tab="next" type="button" role="tab" aria-selected="true">Up Next</button>
    <button class="queue-tab" data-queue-tab="history" type="button" role="tab" aria-selected="false">History</button>
  </div>
  <div class="hairline"></div>
  <div id="queue-list" class="queue-list"></div>
  <div class="hairline"></div>
  <div class="queue-footer">
    <button id="queue-clear" class="mini-button" type="button">Clear</button>
    <span id="queue-count" class="queue-count"></span>
  </div>
</div>

<div id="menu-root" class="menu-root hidden" role="menu"></div>
<div id="modal-root" class="modal-root hidden"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

</html>
