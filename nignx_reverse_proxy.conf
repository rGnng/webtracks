# WebTracks reverse proxy example for nginx.
#
# 1. Replace music.example.com, the certificate paths, and the backend address.
# 2. Keep WebTracks listening on loopback (for example 127.0.0.1:8780) or
#    firewall the backend port so only nginx can reach it. WebTracks trusts
#    X-Forwarded-For when recording the client IP.
# 3. Test with: sudo nginx -t && sudo nginx -s reload

upstream webtracks_backend {
    server 127.0.0.1:8780;
    keepalive 16;
}

# Redirect plain HTTP to HTTPS. Remove this block for an HTTP-only setup.
server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # WebTracks accepts JSON requests up to 4 MiB.
    client_max_body_size 4m;

    # Proxy headers. Overwrite X-Forwarded-For instead of appending so a
    # client cannot prepend a spoofed address. WebTracks also reads Cloudflare
    # Tunnel's CF-Connecting-IP directly, so tunnel clients are identified
    # even though $remote_addr is the tunnel address.
    #
    # The real_ip block is optional and only needed when nginx itself must see
    # the client IP (for logging or other modules):
    #
    #   set_real_ip_from 127.0.0.1;
    #   set_real_ip_from ::1;
    #   real_ip_header CF-Connecting-IP;
    #   real_ip_recursive on;
    #
    # Use cloudflared's actual address or Docker subnet instead of loopback
    # when it runs in a container.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Required for upstream keepalive. WebTracks does not use WebSockets.
    proxy_set_header Connection "";

    # Audio and transcoded streams can run for a long time; do not let nginx
    # buffer or time out a playing track.
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://webtracks_backend;
    }

    # HTTP Range requests for original audio and transcoded audio.
    location /api/audio/ {
        proxy_pass http://webtracks_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: cache artwork at the proxy. Uncomment this block and the
    # proxy_cache_path directive below in the http {} context.
    #
    # location /api/artwork/ {
    #     proxy_pass http://webtracks_backend;
    #     proxy_cache webtracks_artwork;
    #     proxy_cache_valid 200 1h;
    #     proxy_cache_key "$scheme$request_method$host$request_uri";
    #     add_header X-Cache-Status $upstream_cache_status;
    # }
}

# Put this in the http {} context when enabling the artwork cache above.
#
# proxy_cache_path /var/cache/nginx/webtracks_artwork
#                  levels=1:2
#                  keys_zone=webtracks_artwork:10m
#                  max_size=2g
#                  inactive=24h
#                  use_temp_path=off;
