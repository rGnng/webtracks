# WebTracks configuration example.
#
# Copy this file to config.yaml and edit the copy:
#
#     cp config.example.yaml config.yaml
#
# config.yaml is ignored by git so local paths, ports, and password hashes are
# never committed. Relative paths below are resolved against the directory
# containing the configuration file.

# Directory for library.sqlite and the Artwork/ cache.
database_dir: data

# Listen address. Use 127.0.0.1 for local-only access, or 0.0.0.0 for LAN.
host: 127.0.0.1
port: 8765

# Refuse all database writes: stars, play counts, playlists, scans, and ReKey.
read_only: false

# Album art cache: maximum cover width/height in pixels (16-2000) and JPEG
# quality (15-100). Applies when covers are written during a scan/ReKey.
cover_size: 500
jpeg_quality: 80

# Transcode cache limit in MiB, shared across all qualities.
# 0 transcodes without retaining output.
transcode_cache_mb: 512

# Audio streaming formats. `index` identifies the format and
# `default_audio_format` selects the default entry. Currently only AAC is
# implemented; add {"index": 1, "format": "aac", "bitrate": 96} for AAC 96
# kbps, or {"index": 2, "format": "raw"} to allow the original file.
audio_formats:
  - index: 0
    format: aac
    bitrate: 128

# Index from audio_formats used by default.
default_audio_format: 0

# Default Albums sort: recentlyAdded, album, artist, or year.
album_sort: recentlyAdded
album_sort_descending: true

# SHA-1 of the Setup admin password. The value below is the development
# default for the password "1". Change it from Setup -> Admin.
admin_password_sha1: "356a192b7913b04c54574d18c28d46e6395428ab"

# In-memory admin login brute-force protection, applied per source IP.
# More than this many failures in the window locks the IP for the lock period.
# Set the limit to 0 to disable.
admin_bruteforce_limit: 5
admin_bruteforce_window_seconds: 60
admin_bruteforce_lock_seconds: 86400

# Runtime and operation logs: runtime.log and operations.log.
# log_format: text writes human-readable lines; json writes one JSON object
# per line.
logs_dir: logs
log_level: INFO
log_format: text

# Maximum distinct audio items downloaded per source IP in a rolling minute.
# 0 disables the limit.
rate_limit: 28

# How album, song, and playlist links are displayed: uuid or base64url.
url_id_format: uuid

# Optional: seed library folders on first start. After that, folders and
# identifiers live in the libraries table of library.sqlite, not in this file.
# libraries:
#   - path: /Users/me/Music

# Legacy alternative to "libraries", imported once for older configurations.
# music_dirs:
#   - /Users/me/Music
